name: CI

on:
  push:
    branches: [main, rev]
  pull_request:
    branches: [main, rev]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        # windows-latest defaults to PowerShell; the cleanup step needs bash.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: cardiff
        run: pip install -e ".[dev]"

      # Install the TeX distribution README.md recommends for each OS so the
      # XeLaTeX compile tests run instead of being skipped.
      - name: Install XeLaTeX (TeX Live)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex

      - name: Install XeLaTeX (MiKTeX)
        if: runner.os == 'Windows'
        run: |
          choco install miktex --no-progress -y
          miktex_bin='/c/Program Files/MiKTeX/miktex/bin/x64'
          # Install missing LaTeX packages on demand instead of prompting.
          "$miktex_bin/initexmf.exe" --admin --set-config-value='[MPM]AutoInstall=1'
          cygpath -w "$miktex_bin" >> "$GITHUB_PATH"

      - name: Check XeLaTeX is on PATH
        run: xelatex --version

      - name: Clean transient test work directories
        working-directory: cardiff
        run: |
          rm -rf \
            tests/fixtures/approved-samples/business-card/.cardiff-qr \
            tests/fixtures/approved-samples/business-card/_directive-work
          find tests/fixtures/approved-samples/business-card -mindepth 1 -maxdepth 1 -type d \
            -name 'cardiff-qr-*' -exec rm -rf {} +
          find tests/fixtures -mindepth 1 -maxdepth 1 -type d \
            -name 'tmp*' -exec rm -rf {} +
          find . -mindepth 1 -maxdepth 1 -type d \
            \( -name 'pytest-cache-files-*' -o -name 'tmp*' \) -exec rm -rf {} +

      - name: Run contract tests
        working-directory: cardiff
        run: python -m pytest tests/contract -q -p no:cacheprovider

      - name: Run rendering tests
        working-directory: cardiff
        run: python -m pytest tests/rendering -q -p no:cacheprovider

      - name: Run CLI tests
        working-directory: cardiff
        run: python -m pytest tests/cli -q -p no:cacheprovider

  package:
    name: Package build and install smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        working-directory: cardiff
        run: python -m build

      - name: Verify wheel contents and metadata
        working-directory: cardiff
        run: |
          python - <<'PY'
          import email
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {wheels}")

          required = {
              "cardiff/templates/business-card/card.tex",
              "cardiff/templates/business-card/manifest.json",
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              missing = sorted(required - names)
              if missing:
                  sys.exit(f"{wheels[0]} is missing bundled template files: {missing}")
              metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(wheel.read(metadata_path))

          if not (metadata.get_payload() or "").strip():
              sys.exit(f"{wheels[0]} has no long description in METADATA")

          print(f"{wheels[0]} includes the bundled templates and a long description")
          PY

      - name: Smoke-test a standard wheel install
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install cardiff/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/cardiff" render \
            "$GITHUB_WORKSPACE/cardiff/tests/fixtures/requests/valid-request.yaml" \
            --approved-asset-root "$GITHUB_WORKSPACE/cardiff/tests/fixtures/approved-assets" \
            --output "$RUNNER_TEMP/wheel-smoke.pdf" \
            --deterministic

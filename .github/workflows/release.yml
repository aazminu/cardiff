name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate_release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.project-version.outputs.package-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: project-version
        name: Read package version
        working-directory: cardiff
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]

          print(f"package-version={version}")
          PY

      - name: Ensure tag matches package version
        run: |
          if [ "v${{ steps.project-version.outputs.package-version }}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${{ steps.project-version.outputs.package-version }}." >&2
            exit 1
          fi

  test:
    name: Release verification (Python ${{ matrix.python-version }})
    needs: validate_release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: cardiff
        run: pip install -e ".[dev]"

      - name: Clean transient test work directories
        working-directory: cardiff
        run: |
          rm -rf \
            tests/fixtures/approved-samples/business-card/.cardiff-qr \
            tests/fixtures/approved-samples/business-card/_directive-work
          find tests/fixtures/approved-samples/business-card -mindepth 1 -maxdepth 1 -type d \
            -name 'cardiff-qr-*' -exec rm -rf {} +
          find tests/fixtures -mindepth 1 -maxdepth 1 -type d \
            -name 'tmp*' -exec rm -rf {} +
          find . -mindepth 1 -maxdepth 1 -type d \
            \( -name 'pytest-cache-files-*' -o -name 'tmp*' \) -exec rm -rf {} +

      - name: Run contract tests
        working-directory: cardiff
        run: python -m pytest tests/contract -q -p no:cacheprovider

      - name: Run rendering tests
        working-directory: cardiff
        run: python -m pytest tests/rendering -q -p no:cacheprovider

      - name: Run CLI tests
        working-directory: cardiff
        run: python -m pytest tests/cli -q -p no:cacheprovider

  build:
    name: Build distribution
    needs: [validate_release, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        working-directory: cardiff
        run: python -m build

      - name: Verify wheel contents and metadata
        working-directory: cardiff
        run: |
          python - <<'PY'
          import email
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {wheels}")

          required = {
              "cardiff/templates/business-card/card.tex",
              "cardiff/templates/business-card/manifest.json",
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              missing = sorted(required - names)
              if missing:
                  sys.exit(f"{wheels[0]} is missing bundled template files: {missing}")
              metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(wheel.read(metadata_path))

          if not (metadata.get_payload() or "").strip():
              sys.exit(f"{wheels[0]} has no long description in METADATA")

          print(f"{wheels[0]} includes the bundled templates and a long description")
          PY

      - name: Smoke-test a standard wheel install
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install cardiff/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/cardiff" render \
            "$GITHUB_WORKSPACE/cardiff/tests/fixtures/requests/valid-request.yaml" \
            --approved-asset-root "$GITHUB_WORKSPACE/cardiff/tests/fixtures/approved-assets" \
            --output "$RUNNER_TEMP/wheel-smoke.pdf" \
            --deterministic

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cardiff/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
